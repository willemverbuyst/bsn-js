version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
      day: "sunday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*vitest*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
      day: "sunday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "
